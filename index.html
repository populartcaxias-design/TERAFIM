<style>

  .window{position:absolute;left:10%;top:9%;width:25%;height:23%;border-radius:14px;background:#7ed5ff;border:7px solid #292e54;box-shadow:inset 0 0 0 3px #9ce4ff}

  .cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud:before{width:18px;height:18px;left:7px;top:-8px}.cloud:after{width:22px;height:22px;right:3px;top:-11px}

  .pet:before,.pet:after{content:"";position:absolute;top:39%;width:16px;height:24px;background:#17182c;border-radius:50%}

  .bubble{position:absolute;left:50%;top:4%;transform:translateX(-50%);background:#fff;color:#252747;padding:8px 12px;border-radius:16px;font-weight:800;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.2);display:none;z-index:4}
  .bubble:after{content:"";position:absolute;bottom:-7px;left:50%;border:7px solid transparent;border-top-color:#fff;border-bottom:0;transform:translateX(-50%)}
  .room-action{position:absolute;right:10px;bottom:10px;width:46px;height:46px;border-radius:15px;background:#1a1e3caa;border:1px solid #555e92;font-size:22px}
  .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-top:8px}
  .action{background:var(--panel);border:1px solid #30365f;border-radius:17px;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 7px 15px rgba(0,0,0,.16)}
  .action:active,.nav:active{transform:scale(.95)}.action .ico{font-size:25px}.action small{font-size:10px;color:var(--muted);font-weight:800}
  nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px 10px;background:#0d1020;border-top:1px solid #292e50}
  .nav{background:transparent;padding:5px 2px;color:#8f96bc;font-size:11px;font-weight:800}.nav.active{color:#fff}
  .nav .nicon{display:block;font-size:22px;margin-bottom:2px}
  .modal{position:absolute;inset:0;background:rgba(5,7,17,.74);backdrop-filter:blur(6px);display:none;align-items:flex-end;z-index:20}
  .modal.show{display:flex}
  .sheet{width:100%;background:#171a34;border:1px solid #373e6c;border-radius:26px 26px 0 0;padding:16px;max-height:80%;overflow:auto}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheet h2{margin:0;font-size:20px}
  .close{width:34px;height:34px;border-radius:12px;background:#282d52}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .card{background:#202447;border:1px solid #353c69;border-radius:18px;padding:12px}
  .card button{width:100%;margin-top:9px;background:var(--accent);border-radius:12px;padding:9px;font-weight:900}
  .card button:disabled{opacity:.45}
  .item-icon{font-size:34px}.price{color:var(--gold);font-weight:900}
  .mission{display:flex;align-items:center;gap:10px;background:#202447;border-radius:15px;padding:11px;margin:8px 0}.mission .mi{font-size:25px}
  .mission p{margin:0;flex:1;font-size:13px}.mission b{color:var(--gold)}
  .toast{position:absolute;left:50%;bottom:94px;transform:translate(-50%,20px);background:#fff;color:#20233f;padding:10px 15px;border-radius:14px;font-weight:900;opacity:0;pointer-events:none;transition:.25s;z-index:30;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .sleep{filter:brightness(.65)}.sleep .pet{animation:breathe 2.2s infinite ease-in-out}
  @keyframes breathe{50%{transform:scale(.97)}}
  .heart{position:absolute;font-size:22px;animation:float 1s forwards;pointer-events:none}
  @keyframes float{to{transform:translateY(-90px) scale(1.4);opacity:0}}
  @media (max-height:650px){.pet-wrap{bottom:17%;width:min(48%,220px)}.room{min-height:260px}.actions{padding-top:6px}.action{padding:5px}.action .ico{font-size:21px}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand">NIMO <span>●</span></div>
    <div class="coins">🪙 <span id="coins">120</span></div>
  </header>

  <main>
    <section class="stats">
      <div class="stat"><div class="stat-top"><span>❤️ Saúde</span><b id="healthTxt">86</b></div><div class="bar"><div id="healthBar" class="fill health"></div></div></div>
      <div class="stat"><div class="stat-top"><span>🍎 Fome</span><b id="hungerTxt">72</b></div><div class="bar"><div id="hungerBar" class="fill hunger"></div></div></div>
      <div class="stat"><div class="stat-top"><span>⚡ Energia</span><b id="energyTxt">81</b></div><div class="bar"><div id="energyBar" class="fill energy"></div></div></div>
    </section>

    <section class="room" id="room">
      <div class="window"><div class="cloud"></div></div>
      <div class="plant">🌿</div><div class="shelf"></div><div class="rug"></div>
      <div class="bubble" id="bubble">Oi! Vamos brincar?</div>
      <div class="pet-shadow"></div>
      <div class="pet-wrap" id="petWrap">
        <div class="pet" id="pet">
          <div class="eye-shine"></div><div class="blush l"></div><div class="blush r"></div><div class="mouth"></div>
        </div>
      </div>
      <button class="room-action" id="speakBtn" aria-label="Conversar">💬</button>
    </section>

    <section class="actions">
      <button class="action" onclick="feed()"><span class="ico">🍎</span><small>Comida</small></button>
      <button class="action" onclick="play()"><span class="ico">🎮</span><small>Brincar</small></button>
      <button class="action" onclick="sleepToggle()"><span class="ico" id="sleepIcon">😴</span><small>Dormir</small></button>
      <button class="action" onclick="bath()"><span class="ico">🛁</span><small>Banho</small></button>
    </section>
  </main>

  <nav>
    <button class="nav active" onclick="closeAll()"><span class="nicon">🏠</span>Casa</button>
    <button class="nav" onclick="openShop()"><span class="nicon">🛍️</span>Loja</button>
    <button class="nav" onclick="openGames()"><span class="nicon">🕹️</span>Jogos</button>
    <button class="nav" onclick="openMissions()"><span class="nicon">🏆</span>Missões</button>
  </nav>

  <div class="toast" id="toast"></div>

  <div class="modal" id="modal" onclick="if(event.target===this)closeAll()">
    <div class="sheet">
      <div class="sheet-head"><h2 id="modalTitle">Loja</h2><button class="close" onclick="closeAll()">✕</button></div>
      <div id="modalContent"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const state = {
    coins: Number(localStorage.getItem('nimoCoins')) || 120,
    health: Number(localStorage.getItem('nimoHealth')) || 86,
    hunger: Number(localStorage.getItem('nimoHunger')) || 72,
    energy: Number(localStorage.getItem('nimoEnergy')) || 81,
    sleeping: false,
    bathLevel: 75,
    wins: Number(localStorage.getItem('nimoWins')) || 0,
    foods: Number(localStorage.getItem('nimoFoods')) || 3
  };

  const $ = id => document.getElementById(id);
  const clamp = n => Math.max(0, Math.min(100, Math.round(n)));

  function save(){
    localStorage.setItem('nimoCoins', state.coins);
    localStorage.setItem('nimoHealth', state.health);
    localStorage.setItem('nimoHunger', state.hunger);
    localStorage.setItem('nimoEnergy', state.energy);
    localStorage.setItem('nimoWins', state.wins);
    localStorage.setItem('nimoFoods', state.foods);
  }
  function render(){
    $('coins').textContent=state.coins;
    ['health','hunger','energy'].forEach(k=>{
      $(k+'Txt').textContent=clamp(state[k]);
      $(k+'Bar').style.width=clamp(state[k])+'%';
    });
    $('room').classList.toggle('sleep',state.sleeping);
    $('sleepIcon').textContent=state.sleeping?'☀️':'😴';
    save();
  }
  function toast(msg){
    const t=$('toast');t.textContent=msg;t.classList.add('show');
    clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),1500);
  }
  function bubble(msg){
    $('bubble').textContent=msg;$('bubble').style.display='block';
    clearTimeout(window.bubbleTimer);window.bubbleTimer=setTimeout(()=>$('bubble').style.display='none',2200);
  }
  function hearts(){
    for(let i=0;i<3;i++){const h=document.createElement('div');h.className='heart';h.textContent='💜';
      h.style.left=(42+Math.random()*16)+'%';h.style.bottom=(25+Math.random()*15)+'%';$('room').appendChild(h);
      setTimeout(()=>h.remove(),1000)}
  }
  function petBounce(){ $('petWrap').animate([{transform:'translateX(-50%) scale(1)'},{transform:'translateX(-50%) scale(1.08)'},{transform:'translateX(-50%) scale(1)'}],{duration:420}); }

  window.feed=function(){
    if(state.sleeping){bubble('Estou dormindo... 😴');return}
    if(state.foods<=0){openShop();toast('Acabou a comida!');return}
    state.foods--;state.hunger+=16;state.health+=2;state.coins+=3;render();petBounce();hearts();bubble('Hmmm! Delícia! 🍎');toast('+16 fome • +3 moedas');
  }
  window.play=function(){
    if(state.sleeping){bubble('Zzz...');return}
    if(state.energy<12){bubble('Estou cansado! ⚡');toast('Preciso descansar.');return}
    state.energy-=12;state.hunger-=5;state.health+=1;state.coins+=8;state.wins++;
    render();petBounce();bubble('Isso foi divertido! 🎮');toast('+8 moedas');
  }
  window.sleepToggle=function(){
    state.sleeping=!state.sleeping;
    if(state.sleeping){bubble('Boa noite! 🌙');toast('Nimo foi dormir.')}
    else{state.energy+=35;state.health+=5;bubble('Bom dia! ☀️');toast('Nimo descansou!');}
    render();
  }
  window.bath=function(){
    if(state.sleeping){bubble('Depois do meu cochilo...');return}
    state.health+=7;state.energy-=3;state.coins+=4;state.bathLevel=100;render();bubble('Agora estou limpinho! 🫧');toast('+7 saúde • +4 moedas');
  }
  window.closeAll=function(){$('modal').classList.remove('show')}
  window.openShop=function(){
    $('modalTitle').textContent='🛍️ Loja do Nimo';
    $('modalContent').innerHTML=`
      <div class="grid">
        <div class="card"><div class="item-icon">🍎</div><b>Maçã</b><p>Recupera 16 de fome.</p><span class="price">🪙 10</span><button onclick="buyFood()">Comprar</button></div>
        <div class="card"><div class="item-icon">🍕</div><b>Pizza</b><p>Recupera 30 de fome.</p><span class="price">🪙 25</span><button onclick="buyPizza()">Comprar</button></div>
        <div class="card"><div class="item-icon">🎩</div><b>Chapéu Neon</b><p>Visual exclusivo para Nimo.</p><span class="price">🪙 80</span><button onclick="buyItem('chapéu',80)">Comprar</button></div>
        <div class="card"><div class="item-icon">🛹</div><b>Skate Lunar</b><p>Desbloqueia um novo visual.</p><span class="price">🪙 120</span><button onclick="buyItem('skate',120)">Comprar</button></div>
      </div>`;
    $('modal').classList.add('show');
  }
  window.buyFood=function(){if(state.coins<10)return toast('Moedas insuficientes!');state.coins-=10;state.foods++;render();toast('🍎 Comida comprada!');}
  window.buyPizza=function(){if(state.coins<25)return toast('Moedas insuficientes!');state.coins-=25;state.hunger+=30;render();toast('🍕 Nimo comeu pizza!');}
  window.buyItem=function(name,cost){if(state.coins<cost)return toast('Moedas insuficientes!');state.coins-=cost;render();bubble(name==='chapéu'?'Uau! Que estilo! 😎':'Bora andar de skate! 🛹');toast('Item desbloqueado!');}

  window.openGames=function(){
    $('modalTitle').textContent='🕹️ Mini-jogos';
    $('modalContent').innerHTML=`
      <div class="card" style="margin-bottom:10px"><div class="item-icon">🎯</div><b>Toque no Alvo</b><p>Faça 10 toques rápidos para ganhar moedas.</p><button onclick="targetGame()">Jogar por 🪙 5</button></div>
      <div class="card"><div class="item-icon">🧠</div><b>Memória Relâmpago</b><p>Um desafio simples de memória.</p><button onclick="memoryGame()">Jogar por 🪙 5</button></div>`;
    $('modal').classList.add('show');
  }
  window.targetGame=function(){if(state.coins<5)return toast('Moedas insuficientes!');state.coins-=5;render();let score=Number(prompt('Quantos alvos você acertou? Digite de 0 a 10:'));if(Number.isNaN(score))return;if(score<0)score=0;if(score>10)score=10;let reward=score*3;state.coins+=reward;state.energy-=Math.min(10,score);state.wins+=score>=8?1:0;render();toast('Você ganhou 🪙 '+reward+'!');}
  window.memoryGame=function(){if(state.coins<5)return toast('Moedas insuficientes!');state.coins-=5;render();const answer=Math.floor(Math.random()*4)+1;const start=performance.now();alert('Memorize este número: '+answer);const typed=Number(prompt('Qual era o número?'));const reward=typed===answer?25:0;state.coins+=reward;state.wins+=typed===answer?1:0;render();toast(typed===answer?'🧠 Perfeito! +25 moedas':'Quase! Tente novamente.');}

  window.openMissions=function(){
    $('modalTitle').textContent='🏆 Missões';
    $('modalContent').innerHTML=`
      <div class="mission"><span class="mi">🍎</span><p>Alimente Nimo 3 vezes<br><b>${Math.min(state.foods,3)}/3 concluído</b></p><strong>🪙 +20</strong></div>
      <div class="mission"><span class="mi">🎮</span><p>Brinque 5 vezes<br><b>${Math.min(state.wins,5)}/5 pontos</b></p><strong>🪙 +30</strong></div>
      <div class="mission"><span class="mi">🛁</span><p>Dê um banho caprichado<br><b>1/1 concluído</b></p><strong>🪙 +15</strong></div>
      <div class="card" style="margin-top:10px"><b>Seu progresso</b><p>🏆 Vitórias: ${state.wins}<br>🍎 Comidas em estoque: ${state.foods}</p></div>`;
    $('modal').classList.add('show');
  }

  $('speakBtn').onclick=()=>{const phrases=['Você é meu melhor amigo! 💜','Vamos explorar? ✨','Estou com fome... 🍎','Que dia bonito! ☀️','Bora jogar! 🎮'];bubble(phrases[Math.floor(Math.random()*phrases.length)]);petBounce();}
  $('pet').addEventListener('click',()=>{bubble('Hehe! 😄');petBounce();state.health=Math.min(100,state.health+1);render();});
  setInterval(()=>{if(state.sleeping){state.energy=Math.min(100,state.energy+4);state.health=Math.min(100,state.health+1)}else{state.hunger=Math.max(0,state.hunger-.6);state.energy=Math.max(0,state.energy-.25);if(state.hunger<20)state.health=Math.max(0,state.health-.2)}render()},5000);
  render();
})();
</script>
</body>
</html>
'''

path = Path("/mnt/data/index.html")
path.write_text(html, encoding="utf-8")
print(f"Arquivo criado: {path}")
