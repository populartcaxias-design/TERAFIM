<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10152b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NIMO - Meu Companheiro</title>
<style>
:root{
  --bg:#0d1124;
  --panel:#171c36;
  --panel2:#20274a;
  --line:#353e6b;
  --text:#f7f8ff;
  --muted:#aeb6d8;
  --purple:#785cff;
  --cyan:#29dec5;
  --yellow:#ffd166;
  --red:#ff5f78;
  --orange:#ffb347;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.app{
  width:100%;max-width:520px;height:100dvh;display:flex;flex-direction:column;
  background:radial-gradient(circle at 50% 0%,#303969 0,#171a32 40%,#0c1020 100%);
}
header{
  min-height:62px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;
  gap:10px;flex-shrink:0;
}
.logo{font-size:22px;font-weight:1000;letter-spacing:1px}
.logo i{font-style:normal;color:var(--cyan)}
.money{background:#0a0e1e;border:1px solid var(--line);padding:8px 12px;border-radius:15px;font-weight:900;color:var(--yellow)}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 11px 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px;flex-shrink:0}
.stat{background:#171b35dd;border:1px solid var(--line);border-radius:14px;padding:7px 8px}
.stat-title{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-weight:900}
.bar{height:7px;background:#0b0f20;border-radius:20px;overflow:hidden;margin-top:5px}
.fill{height:100%;border-radius:20px;transition:width .35s}
.health{background:var(--red)}.hunger{background:var(--orange)}.energy{background:var(--cyan)}
.room{
  flex:1;min-height:240px;position:relative;overflow:hidden;border-radius:28px;
  border:1px solid #46517e;box-shadow:0 18px 40px #0007;
  background:linear-gradient(to bottom,#374477 0 60%,#77503d 60% 100%);
}
.window{position:absolute;left:9%;top:9%;width:26%;height:24%;background:#7edcff;border:7px solid #292f57;border-radius:16px;overflow:hidden}
.sun{position:absolute;right:12%;top:15%;width:28px;height:28px;border-radius:50%;background:#ffe38a;box-shadow:0 0 18px #fff0a8}
.cloud{position:absolute;left:12%;bottom:22%;width:46px;height:15px;border-radius:20px;background:#fff;opacity:.8}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:22px;height:22px;left:7px;top:-10px}.cloud:after{width:27px;height:27px;right:4px;top:-14px}
.shelf{position:absolute;right:7%;top:20%;width:31%;height:9px;background:#57372e;border-radius:10px}
.plant{position:absolute;right:10%;top:6%;font-size:42px}
.picture{position:absolute;right:10%;top:31%;font-size:28px}
.rug{position:absolute;left:18%;bottom:7%;width:64%;height:17%;background:#4f4168;border-radius:50%;opacity:.9}
.shadow{position:absolute;left:50%;bottom:18%;width:38%;height:8%;transform:translateX(-50%);border-radius:50%;background:#0004;filter:blur(5px)}
.pet-wrap{
  position:absolute;left:50%;bottom:20%;width:min(64%,275px);aspect-ratio:1;
  transform:translateX(-50%);display:flex;align-items:center;justify-content:center;
  transition:filter .3s;
}
.pet{
  width:72%;height:72%;position:relative;border-radius:47% 53% 48% 52% / 45% 44% 56% 55%;
  background:linear-gradient(145deg,#9279ff,#6045d8);border:7px solid #392b91;
  box-shadow:inset 10px 10px 0 #ffffff12,inset -13px -16px 0 #00000015,0 18px 30px #0003;
}
.eye{position:absolute;top:39%;width:17px;height:25px;background:#14162a;border-radius:50%}
.eye.left{left:22%}.eye.right{right:22%}
.eye:after{content:"";position:absolute;left:4px;top:4px;width:5px;height:7px;border-radius:50%;background:white}
.cheek{position:absolute;top:55%;width:19px;height:9px;border-radius:50%;background:#ff7991aa}
.cheek.left{left:12%}.cheek.right{right:12%}
.mouth{position:absolute;left:50%;top:57%;width:34px;height:17px;transform:translateX(-50%);border-bottom:5px solid #15172b;border-radius:0 0 30px 30px}
.ear{position:absolute;top:14%;width:27%;height:28%;background:#6a4bdd;border:6px solid #392b91;z-index:-1}
.ear.left{left:-3%;transform:rotate(-30deg);border-radius:65% 30% 50% 35%}
.ear.right{right:-3%;transform:rotate(30deg);border-radius:30% 65% 35% 50%}
.bubble{
  display:none;position:absolute;z-index:5;left:50%;top:4%;transform:translateX(-50%);
  max-width:78%;background:white;color:#252846;padding:9px 13px;border-radius:16px;
  font-size:13px;font-weight:900;text-align:center;box-shadow:0 8px 20px #0003;
}
.bubble:after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fff;border-bottom:0}
.speak{
  position:absolute;right:10px;bottom:10px;width:46px;height:46px;border-radius:15px;
  background:#171b38cc;border:1px solid #59628f;font-size:21px;
}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding-top:8px;flex-shrink:0}
.action{
  background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:8px 3px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;
  box-shadow:0 7px 15px #0003;
}
.action:active,.nav:active{transform:scale(.94)}
.action span{font-size:24px}.action small{font-size:10px;color:var(--muted)}
nav{
  flex-shrink:0;padding:7px 10px calc(7px + env(safe-area-inset-bottom));
  background:#0b0f20;border-top:1px solid #293052;display:grid;grid-template-columns:repeat(4,1fr);gap:4px
}
.nav{background:transparent;color:#8991b8;font-size:10px;font-weight:900;padding:2px}
.nav.active{color:white}.nav span{display:block;font-size:22px;margin-bottom:1px}
.modal{
  display:none;position:absolute;inset:0;z-index:20;background:#050817bb;backdrop-filter:blur(6px);
  align-items:flex-end;
}
.modal.show{display:flex}
.sheet{
  width:100%;max-height:82%;overflow:auto;background:#151932;border:1px solid #394271;
  border-radius:25px 25px 0 0;padding:16px;
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet h2{margin:0;font-size:20px}.close{width:36px;height:36px;border-radius:12px;background:#282f53}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.card{background:var(--panel2);border:1px solid #37406c;border-radius:17px;padding:12px}
.card .icon{font-size:34px}.card p{margin:5px 0;color:var(--muted);font-size:12px;line-height:1.3}
.card button,.primary{width:100%;padding:9px;border-radius:12px;background:var(--purple);font-weight:1000;margin-top:8px}
.price{color:var(--yellow);font-weight:1000}
.mission{display:flex;align-items:center;gap:10px;background:var(--panel2);padding:11px;border-radius:15px;margin-bottom:8px}
.mission .icon{font-size:25px}.mission p{margin:0;flex:1;font-size:12px}.mission b{color:var(--cyan)}
.toast{
  position:absolute;z-index:50;left:50%;bottom:93px;transform:translate(-50%,20px);opacity:0;
  pointer-events:none;background:white;color:#20233e;border-radius:14px;padding:10px 14px;font-weight:1000;
  transition:.25s;white-space:nowrap;box-shadow:0 8px 20px #0004
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.heart{position:absolute;z-index:6;font-size:22px;pointer-events:none;animation:floatUp 1s forwards}
@keyframes floatUp{to{transform:translateY(-85px) scale(1.35);opacity:0}}
.sleeping{filter:brightness(.6)}
.sleeping .pet{animation:breathe 2.2s infinite}
@keyframes breathe{50%{transform:scale(.96)}}
@media(max-height:650px){
  header{min-height:52px;padding:7px 12px}.stats{margin-bottom:5px}
  .pet-wrap{bottom:16%;width:min(52%,220px)}.actions{padding-top:5px}
  .action{padding:5px}.action span{font-size:21px}.nav span{font-size:19px}
}
</style>
</head>
<body>
<div class="app" id="app">
<header>
  <div class="logo">NIMO <i>●</i></div>
  <div class="money">🪙 <span id="coins">120</span></div>
</header>

<main>
  <div class="stats">
    <div class="stat"><div class="stat-title"><span>❤️ Saúde</span><b id="healthTxt">86</b></div><div class="bar"><div id="healthBar" class="fill health"></div></div></div>
    <div class="stat"><div class="stat-title"><span>🍎 Fome</span><b id="hungerTxt">72</b></div><div class="bar"><div id="hungerBar" class="fill hunger"></div></div></div>
    <div class="stat"><div class="stat-title"><span>⚡ Energia</span><b id="energyTxt">81</b></div><div class="bar"><div id="energyBar" class="fill energy"></div></div></div>
  </div>

  <section class="room" id="room">
    <div class="window"><div class="sun"></div><div class="cloud"></div></div>
    <div class="plant">🌿</div><div class="shelf"></div><div class="picture">🖼️</div>
    <div class="rug"></div><div class="bubble" id="bubble"></div><div class="shadow"></div>
    <div class="pet-wrap" id="petWrap">
      <div class="pet" id="pet">
        <div class="ear left"></div><div class="ear right"></div>
        <div class="eye left"></div><div class="eye right"></div>
        <div class="cheek left"></div><div class="cheek right"></div><div class="mouth"></div>
      </div>
    </div>
    <button class="speak" onclick="talk()">💬</button>
  </section>

  <div class="actions">
    <button class="action" onclick="feed()"><span>🍎</span><small>Comida</small></button>
    <button class="action" onclick="play()"><span>🎮</span><small>Brincar</small></button>
    <button class="action" onclick="sleepToggle()"><span id="sleepIcon">😴</span><small>Dormir</small></button>
    <button class="action" onclick="bath()"><span>🛁</span><small>Banho</small></button>
  </div>
</main>

<nav>
  <button class="nav active" onclick="closeModal()"><span>🏠</span>Casa</button>
  <button class="nav" onclick="shop()"><span>🛍️</span>Loja</button>
  <button class="nav" onclick="games()"><span>🕹️</span>Jogos</button>
  <button class="nav" onclick="missions()"><span>🏆</span>Missões</button>
</nav>

<div class="toast" id="toast"></div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <div class="sheet-head"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">✕</button></div>
    <div id="modalContent"></div>
  </div>
</div>
</div>

<script>
(() => {
"use strict";

const state={
  coins:Number(localStorage.getItem("nimo_coins"))||120,
  health:Number(localStorage.getItem("nimo_health"))||86,
  hunger:Number(localStorage.getItem("nimo_hunger"))||72,
  energy:Number(localStorage.getItem("nimo_energy"))||81,
  food:Number(localStorage.getItem("nimo_food"))||3,
  plays:Number(localStorage.getItem("nimo_plays"))||0,
  baths:Number(localStorage.getItem("nimo_baths"))||0,
  sleeping:false
};

const $=id=>document.getElementById(id);
const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));

function save(){
  localStorage.setItem("nimo_coins",state.coins);
  localStorage.setItem("nimo_health",state.health);
  localStorage.setItem("nimo_hunger",state.hunger);
  localStorage.setItem("nimo_energy",state.energy);
  localStorage.setItem("nimo_food",state.food);
  localStorage.setItem("nimo_plays",state.plays);
  localStorage.setItem("nimo_baths",state.baths);
}

function render(){
  $("coins").textContent=state.coins;
  ["health","hunger","energy"].forEach(k=>{
    $(k+"Txt").textContent=clamp(state[k]);
    $(k+"Bar").style.width=clamp(state[k])+"%";
  });
  $("room").classList.toggle("sleeping",state.sleeping);
  $("sleepIcon").textContent=state.sleeping?"☀️":"😴";
  save();
}

function toast(msg){
  const el=$("toast");
  el.textContent=msg;
  el.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>el.classList.remove("show"),1500);
}

function bubble(msg){
  const el=$("bubble");
  el.textContent=msg;
  el.style.display="block";
  clearTimeout(window.bubbleTimer);
  window.bubbleTimer=setTimeout(()=>el.style.display="none",2300);
}

function bounce(){
  $("petWrap").animate(
    [{transform:"translateX(-50%) scale(1)"},{transform:"translateX(-50%) scale(1.08)"},{transform:"translateX(-50%) scale(1)"}],
    {duration:420,easing:"ease-out"}
  );
}

function hearts(){
  for(let i=0;i<3;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.textContent="💜";
    h.style.left=(42+Math.random()*16)+"%";
    h.style.bottom=(25+Math.random()*14)+"%";
    $("room").appendChild(h);
    setTimeout(()=>h.remove(),1000);
  }
}

window.feed=function(){
  if(state.sleeping){bubble("Estou dormindo... 😴");return}
  if(state.food<=0){bubble("Acabou minha comida!");shop();return}
  state.food--;
  state.hunger+=16;
  state.health+=2;
  state.coins+=3;
  render();bounce();hearts();
  bubble("Hmmm! Muito bom! 🍎");
  toast("+16 fome • +3 moedas");
};

window.play=function(){
  if(state.sleeping){bubble("Zzz... 😴");return}
  if(state.energy<12){bubble("Estou cansado... ⚡");toast("Nimo precisa descansar.");return}
  state.energy-=12;
  state.hunger-=5;
  state.health+=1;
  state.coins+=8;
  state.plays++;
  render();bounce();
  bubble("Foi divertido! 🎮");
  toast("+8 moedas");
};

window.sleepToggle=function(){
  state.sleeping=!state.sleeping;
  if(state.sleeping){
    bubble("Boa noite! 🌙");
    toast("Nimo foi dormir.");
  }else{
    state.energy+=35;
    state.health+=5;
    bubble("Bom dia! ☀️");
    toast("Nimo descansou!");
  }
  render();
};

window.bath=function(){
  if(state.sleeping){bubble("Depois do meu cochilo! 😴");return}
  state.health+=7;
  state.energy-=3;
  state.coins+=4;
  state.baths++;
  render();
  bubble("Agora estou limpinho! 🫧");
  toast("+7 saúde • +4 moedas");
};

window.talk=function(){
  const phrases=[
    "Você é meu melhor amigo! 💜",
    "Vamos brincar? 🎮",
    "Estou com fome... 🍎",
    "Que dia bonito! ☀️",
    "Quero uma aventura! ✨",
    "Você viu minhas orelhinhas? 😄"
  ];
  bubble(phrases[Math.floor(Math.random()*phrases.length)]);
  bounce();
};

window.shop=function(){
  $("modalTitle").textContent="🛍️ Loja do Nimo";
  $("modalContent").innerHTML=`
    <div class="grid">
      <div class="card"><div class="icon">🍎</div><b>Maçã</b><p>Adiciona 1 comida ao estoque.</p><span class="price">🪙 10</span><button onclick="buyApple()">Comprar</button></div>
      <div class="card"><div class="icon">🍕</div><b>Pizza</b><p>Nimo come na hora e recupera 30 de fome.</p><span class="price">🪙 25</span><button onclick="buyPizza()">Comer</button></div>
      <div class="card"><div class="icon">🎩</div><b>Chapéu Neon</b><p>Item cosmético exclusivo.</p><span class="price">🪙 80</span><button onclick="buyItem('Chapéu Neon',80)">Comprar</button></div>
      <div class="card"><div class="icon">🛹</div><b>Skate Lunar</b><p>Item cosmético exclusivo.</p><span class="price">🪙 120</span><button onclick="buyItem('Skate Lunar',120)">Comprar</button></div>
    </div>`;
  $("modal").classList.add("show");
};

window.buyApple=function(){
  if(state.coins<10){toast("Moedas insuficientes!");return}
  state.coins-=10;state.food++;render();toast("🍎 Maçã adicionada!");
};

window.buyPizza=function(){
  if(state.coins<25){toast("Moedas insuficientes!");return}
  state.coins-=25;state.hunger+=30;state.health+=3;render();
  bubble("PIZZA! 🍕");toast("+30 fome");
};

window.buyItem=function(name,cost){
  if(state.coins<cost){toast("Moedas insuficientes!");return}
  state.coins-=cost;render();bubble(name+" desbloqueado! ✨");toast("Item desbloqueado!");
};

window.games=function(){
  $("modalTitle").textContent="🕹️ Mini-jogos";
  $("modalContent").innerHTML=`
    <div class="card" style="margin-bottom:9px">
      <div class="icon">🎯</div><b>Desafio do Alvo</b>
      <p>Escolha um número de 1 a 3. Se acertar, ganha 25 moedas.</p>
      <button onclick="targetGame()">Jogar por 🪙 5</button>
    </div>
    <div class="card">
      <div class="icon">🔢</div><b>Memória Relâmpago</b>
      <p>Memorize um número e tente lembrar.</p>
      <button onclick="memoryGame()">Jogar por 🪙 5</button>
    </div>`;
  $("modal").classList.add("show");
};

window.targetGame=function(){
  if(state.coins<5){toast("Moedas insuficientes!");return}
  state.coins-=5;render();
  const target=Math.floor(Math.random()*3)+1;
  const answer=Number(prompt("Escolha um número: 1, 2 ou 3"));
  if(answer===target){
    state.coins+=25;state.plays++;render();toast("🎯 Acertou! +25 moedas");
  }else{
    render();toast("Errou! O número era "+target);
  }
};

window.memoryGame=function(){
  if(state.coins<5){toast("Moedas insuficientes!");return}
  state.coins-=5;render();
  const n=Math.floor(Math.random()*900)+100;
  alert("Memorize: "+n);
  const answer=prompt("Qual era o número?");
  if(String(answer)===String(n)){
    state.coins+=30;state.plays++;render();toast("🧠 Perfeito! +30 moedas");
  }else{
    render();toast("Quase! Era "+n);
  }
};

window.missions=function(){
  $("modalTitle").textContent="🏆 Missões";
  const foodDone=state.food>=3;
  const playDone=state.plays>=5;
  const bathDone=state.baths>=1;
  $("modalContent").innerHTML=`
    <div class="mission"><span class="icon">🍎</span><p>Tenha 3 comidas no estoque<br><b>${Math.min(state.food,3)}/3</b></p><strong>🪙 20</strong></div>
    <div class="mission"><span class="icon">🎮</span><p>Brinque ou vença 5 partidas<br><b>${Math.min(state.plays,5)}/5</b></p><strong>🪙 30</strong></div>
    <div class="mission"><span class="icon">🛁</span><p>Dê um banho em Nimo<br><b>${Math.min(state.baths,1)}/1</b></p><strong>🪙 15</strong></div>
    <div class="card"><b>Como jogar</b><p>Cuide do Nimo todos os dias. Comida aumenta a fome, brincadeiras gastam energia, banho recupera saúde e dormir recupera energia.</p></div>`;
  $("modal").classList.add("show");
};

window.closeModal=function(){$("modal").classList.remove("show")};

$("pet").addEventListener("click",()=>{
  if(state.sleeping){bubble("Zzz...");return}
  state.health=Math.min(100,state.health+1);
  render();bounce();hearts();bubble("Hehehe! 😄");
});

setInterval(()=>{
  if(state.sleeping){
    state.energy=Math.min(100,state.energy+4);
    state.health=Math.min(100,state.health+1);
  }else{
    state.hunger=Math.max(0,state.hunger-.5);
    state.energy=Math.max(0,state.energy-.2);
    if(state.hunger<20)state.health=Math.max(0,state.health-.2);
  }
  render();
},5000);

render();
})();
</script>
</body>
</html>
